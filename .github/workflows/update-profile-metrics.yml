
name: Update GitHub Profile Metrics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create profile folder
        run: mkdir -p profile

      - name: Generate GitHub Statistics
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=Ahrar-1898&show_icons=true&theme=tokyonight&hide_border=true&rank_icon=github&include_all_commits=true
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Top Languages
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=Ahrar-1898&layout=compact&theme=tokyonight&hide_border=true
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Contribution Activity Graph
        uses: maurodesouza/github-readme-activity-graph-action@v1
        with:
          username: Ahrar-1898
          options: bg_color=1a1b27&color=7aa2f7&line=bb9af7&point=7dcfff&area=true&hide_border=true
          output_path: profile/activity.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit generated images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update GitHub profile metrics" || exit 0
          git push
